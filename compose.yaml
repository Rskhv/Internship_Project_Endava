services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamify_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-streamify}
    ports:
      - "5432:5432"
    volumes:
      - streamify-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamify_app} -d ${POSTGRES_DB:-streamify}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  streamify-postgres:
