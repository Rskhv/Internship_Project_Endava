<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="Register_css.css">
</head>
<body>  
     <div id="title_logo">
            <h3>STREAMIFY</h3>
        </div>
     <div id="themeToggle" class="theme-toggle">
        <img id="themeIcon" src="Web_Images/night-mode.png" alt="Toggle theme">
    </div>
   <form id="registerForm" class="form-group">

    <h1>Create Account</h1>

    <div>
        <label for="username">NAME</label>
        <input type="text" id="username" name="username" required>
    </div>

    <div>
        <label for="email">EMAIL</label>
        <input type="email" id="email" name="email" required>
    </div>
    <div><label for="password">PASSWORD</label></div>
    <div class="password-container">
    
    <input type="password" id="password">

    <button type="button" class="togglePassword">
        <img src="Web_Images/show.png">
    </button>
</div>
    <div><label for="confirmPassword">CONFIRM PASSWORD</label></div>
<div class="password-container">    
    <input type="password" id="confirmPassword"> 

    <button type="button" class="togglePassword">
        <img src="Web_Images/show.png">
    </button>
</div>

       

    <button type="submit">
        REGISTER
    </button>

</form>
<div id="toast"></div>
<script src="Register_script.js"></script>
<script src="theme.js"></script>
</body>
</html>
